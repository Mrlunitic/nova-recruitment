<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE182" />
      <stop offset="40%" stop-color="#D9A52E" />
      <stop offset="100%" stop-color="#A27310" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123D85" />
      <stop offset="100%" stop-color="#09265B" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Emblem Group -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield / Circle Glow Arc -->
    <circle cx="50" cy="50" r="46" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="3" />
    <circle cx="50" cy="50" r="39" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-dasharray="3,3" stroke-width="1.5" />
    
    <!-- Stylized Compass / Meridian Arc -->
    <path d="M 22 50 A 28 28 0 0 0 78 50" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
    <path d="M 50 22 A 28 28 0 0 0 50 78" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="2,2" />
    
    <!-- Bold 'N' Vector Monogram -->
    <path d="M 34 68 L 34 32 L 44 32 L 58 56 L 58 32 L 66 32 L 66 68 L 56 68 L 42 44 L 42 68 Z" fill="#FFFFFF" />
    
    <!-- Nova Star Accent (4-pointed star bursting in gold at top right of N) -->
    <g transform="translate(62, 34) scale(0.9)">
      <path d="M 0 -14 Q 2 -2 14 0 Q 2 2 0 14 Q -2 2 -14 0 Q -2 -2 0 -14 Z" fill="url(#goldGrad)" filter="url(#subtleGlow)" />
      <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
    </g>
  </g>
  
  <!-- Brand Text -->
  <g transform="translate(130, 26)">
    <!-- Primary Name: NOVA -->
    <text x="0" y="44" font-family="'Plus Jakarta Sans', 'Outfit', 'Montserrat', 'Helvetica Neue', sans-serif" font-weight="900" font-size="46" letter-spacing="4" fill="#09265B">
      NOVA
    </text>
    
    <!-- Gold Dot separator -->
    <circle cx="160" cy="30" r="4.5" fill="url(#goldGrad)" />
    
    <!-- Secondary Name: RECRUITMENT -->
    <text x="178" y="44" font-family="'Plus Jakarta Sans', 'Outfit', 'Montserrat', sans-serif" font-weight="700" font-size="28" letter-spacing="3" fill="#123D85">
      RECRUITMENT
    </text>
    
    <!-- Subtitle / Legal line -->
    <text x="2" y="70" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="600" font-size="12" letter-spacing="4" fill="#D9A52E">
      PVT. LTD. &bull; KATHMANDU, NEPAL
    </text>
    
    <text x="235" y="70" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="500" font-size="11" letter-spacing="1.5" fill="#6c757d">
      GLOBAL MANPOWER CONSULTANTS
    </text>
  </g>
</svg>
