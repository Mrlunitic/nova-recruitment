<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="hGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#123D85" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#09265B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#051736" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE182" />
      <stop offset="100%" stop-color="#D9A52E" />
    </linearGradient>
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="600" rx="20" fill="url(#hGlow)" />

  <!-- Subtle Latitude & Longitude Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.2" fill="none">
    <ellipse cx="400" cy="300" rx="340" ry="240" />
    <ellipse cx="400" cy="300" rx="280" ry="240" />
    <ellipse cx="400" cy="300" rx="180" ry="240" />
    <ellipse cx="400" cy="300" rx="70" ry="240" />
    <line x1="60" y1="300" x2="740" y2="300" />
    <line x1="400" y1="60" x2="400" y2="540" />
    <line x1="120" y1="180" x2="680" y2="180" />
    <line x1="120" y1="420" x2="680" y2="420" />
  </g>

  <!-- World Continents Abstract Mesh (Stylized Polygons) -->
  <g fill="#164390" fill-opacity="0.55" stroke="#255bb5" stroke-opacity="0.4" stroke-width="1">
    <!-- Europe & Middle East -->
    <polygon points="260,180 320,160 380,180 360,250 300,280 270,240" />
    <polygon points="340,240 410,230 430,280 390,320 350,290" />
    <!-- Asia & Himalayas -->
    <polygon points="410,220 520,170 620,210 650,300 580,340 480,320 440,260" />
    <polygon points="560,340 600,380 570,430 530,390" />
  </g>

  <!-- Central Hub: Kathmandu, Nepal -->
  <g transform="translate(460, 260)">
    <!-- Expanding Signal Rings -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="url(#goldG)" stroke-width="1.5" stroke-opacity="0.4">
      <animate attributeName="r" values="10;45" dur="3s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values="0.8;0" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="16" fill="url(#goldG)" fill-opacity="0.25" />
    <circle cx="0" cy="0" r="9" fill="url(#goldG)" filter="url(#nodeGlow)" />
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
    <rect x="-60" y="-36" width="120" height="24" rx="12" fill="#09265B" stroke="url(#goldG)" stroke-width="1.5" />
    <text x="0" y="-20" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" text-anchor="middle" letter-spacing="1">KATHMANDU (HQ)</text>
  </g>

  <!-- Flight / Recruitment Trajectories from Nepal -->
  <!-- Route 1: To UAE / Gulf -->
  <path d="M 460 260 Q 420 220 360 280" fill="none" stroke="url(#goldG)" stroke-width="2.5" stroke-dasharray="6,4" />
  <!-- Route 2: To Saudi Arabia -->
  <path d="M 460 260 Q 400 240 330 300" fill="none" stroke="url(#goldG)" stroke-width="2" stroke-dasharray="4,4" />
  <!-- Route 3: To Malaysia / Singapore -->
  <path d="M 460 260 Q 520 320 570 380" fill="none" stroke="url(#goldG)" stroke-width="2.5" stroke-dasharray="6,4" />
  <!-- Route 4: To Europe (Romania / Poland / Croatia) -->
  <path d="M 460 260 Q 380 140 280 190" fill="none" stroke="url(#goldG)" stroke-width="2.5" stroke-dasharray="6,4" />
  <!-- Route 5: To Japan / East Asia -->
  <path d="M 460 260 Q 550 200 630 210" fill="none" stroke="url(#goldG)" stroke-width="2" stroke-dasharray="4,4" />

  <!-- Destination Nodes -->
  <!-- Middle East Node -->
  <g transform="translate(360, 280)">
    <circle cx="0" cy="0" r="6" fill="#D9A52E" />
    <rect x="-45" y="12" width="90" height="20" rx="10" fill="#09265B" stroke="#ffffff" stroke-width="1" stroke-opacity="0.3" />
    <text x="0" y="26" fill="#F5F7FA" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10" text-anchor="middle">UAE &amp; GULF</text>
  </g>

  <!-- Europe Node -->
  <g transform="translate(280, 190)">
    <circle cx="0" cy="0" r="6" fill="#D9A52E" />
    <rect x="-45" y="-30" width="90" height="20" rx="10" fill="#09265B" stroke="#ffffff" stroke-width="1" stroke-opacity="0.3" />
    <text x="0" y="-16" fill="#F5F7FA" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10" text-anchor="middle">EUROPE</text>
  </g>

  <!-- SE Asia Node -->
  <g transform="translate(570, 380)">
    <circle cx="0" cy="0" r="6" fill="#D9A52E" />
    <rect x="-55" y="12" width="110" height="20" rx="10" fill="#09265B" stroke="#ffffff" stroke-width="1" stroke-opacity="0.3" />
    <text x="0" y="26" fill="#F5F7FA" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10" text-anchor="middle">MALAYSIA / ASIA</text>
  </g>

  <!-- Floating Stats Card 1: 100% Ethical Recruitment -->
  <g transform="translate(80, 80)">
    <rect width="190" height="74" rx="14" fill="#09265B" fill-opacity="0.95" stroke="url(#goldG)" stroke-width="1.5" />
    <circle cx="34" cy="37" r="18" fill="url(#goldG)" fill-opacity="0.2" />
    <path d="M 28 37 L 33 42 L 41 32" fill="none" stroke="#D9A52E" stroke-width="3" stroke-linecap="round" />
    <text x="62" y="32" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15">100% Legal &amp;</text>
    <text x="62" y="50" fill="#D9A52E" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12">Ethical Process</text>
  </g>

  <!-- Floating Stats Card 2: 15+ Global Destinations -->
  <g transform="translate(530, 460)">
    <rect width="210" height="74" rx="14" fill="#09265B" fill-opacity="0.95" stroke="url(#goldG)" stroke-width="1.5" />
    <circle cx="34" cy="37" r="18" fill="url(#goldG)" fill-opacity="0.2" />
    <text x="34" y="42" fill="#D9A52E" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" text-anchor="middle">&#127757;</text>
    <text x="62" y="32" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15">15+ Destinations</text>
    <text x="62" y="50" fill="#CBD5E1" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="12">Middle East &bull; Asia &bull; Europe</text>
  </g>
</svg>
