<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <linearGradient id="pGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCE182" />
      <stop offset="100%" stop-color="#D9A52E" />
    </linearGradient>
  </defs>
  
  <!-- Horizontal Connection Line -->
  <line x1="100" y1="90" x2="900" y2="90" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round" />
  <line x1="100" y1="90" x2="900" y2="90" stroke="url(#pGold)" stroke-width="4" stroke-dasharray="12,12" stroke-linecap="round" />

  <!-- Step 1 -->
  <g transform="translate(100, 90)">
    <circle cx="0" cy="0" r="42" fill="#09265B" stroke="url(#pGold)" stroke-width="4" />
    <text x="0" y="8" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20" text-anchor="middle">01</text>
    <text x="0" y="65" fill="#09265B" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" text-anchor="middle">Demand Letter</text>
    <text x="0" y="84" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" text-anchor="middle">Legal Verification</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(300, 90)">
    <circle cx="0" cy="0" r="42" fill="#09265B" stroke="url(#pGold)" stroke-width="4" />
    <text x="0" y="8" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20" text-anchor="middle">02</text>
    <text x="0" y="65" fill="#09265B" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" text-anchor="middle">Candidate Sourcing</text>
    <text x="0" y="84" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" text-anchor="middle">Talent Pool &amp; Ads</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(500, 90)">
    <circle cx="0" cy="0" r="46" fill="#123D85" stroke="url(#pGold)" stroke-width="5" />
    <circle cx="0" cy="0" r="38" fill="none" stroke="#D9A52E" stroke-opacity="0.3" stroke-dasharray="4,4" />
    <text x="0" y="9" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" text-anchor="middle">03</text>
    <text x="0" y="70" fill="#09265B" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="15" text-anchor="middle">Interview &amp; Selection</text>
    <text x="0" y="89" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" text-anchor="middle">Trade &amp; Skills Testing</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(700, 90)">
    <circle cx="0" cy="0" r="42" fill="#09265B" stroke="url(#pGold)" stroke-width="4" />
    <text x="0" y="8" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20" text-anchor="middle">04</text>
    <text x="0" y="65" fill="#09265B" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" text-anchor="middle">Visa &amp; Processing</text>
    <text x="0" y="84" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" text-anchor="middle">Medical &amp; Labor Dept</text>
  </g>

  <!-- Step 5 -->
  <g transform="translate(900, 90)">
    <circle cx="0" cy="0" r="42" fill="#09265B" stroke="url(#pGold)" stroke-width="4" />
    <text x="0" y="8" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20" text-anchor="middle">05</text>
    <text x="0" y="65" fill="#09265B" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" text-anchor="middle">Final Deployment</text>
    <text x="0" y="84" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" text-anchor="middle">Orientation &amp; Departure</text>
  </g>
</svg>
