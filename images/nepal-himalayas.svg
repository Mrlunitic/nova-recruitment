<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E2F6B" />
      <stop offset="50%" stop-color="#1B4D9B" />
      <stop offset="100%" stop-color="#E8F1FC" />
    </linearGradient>
    <linearGradient id="peakSnow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2EDFB" />
      <stop offset="100%" stop-color="#C5D9F2" />
    </linearGradient>
    <linearGradient id="peakRock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#122A54" />
      <stop offset="100%" stop-color="#0A1833" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCE182" />
      <stop offset="100%" stop-color="#D9A52E" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="900" height="500" rx="16" fill="url(#skyGrad)" />
  <circle cx="750" cy="120" r="50" fill="#FFF2BD" fill-opacity="0.35" />
  <circle cx="750" cy="120" r="35" fill="#FFFFFF" fill-opacity="0.6" />

  <!-- Background Mountain Range (Everest & Lhotse silhouettes) -->
  <polygon points="120,380 290,140 450,380" fill="#2E5A9E" fill-opacity="0.4" />
  <polygon points="290,140 370,240 210,240" fill="#FFFFFF" fill-opacity="0.3" />
  
  <polygon points="340,380 520,110 710,380" fill="#1C407D" fill-opacity="0.6" />
  <polygon points="520,110 590,210 440,210" fill="#FFFFFF" fill-opacity="0.45" />

  <!-- Foreground Majestic Peaks with Sharp Ridge Lighting -->
  <!-- Left Peak -->
  <polygon points="0,500 180,220 380,500" fill="url(#peakRock)" />
  <polygon points="180,220 230,310 130,310" fill="url(#peakSnow)" />
  <polyline points="180,220 170,290 190,340 180,420 180,500" stroke="#09265B" stroke-width="2" />

  <!-- Center-Right Master Summit (Mt. Everest / Sagarmatha) -->
  <polygon points="260,500 500,160 740,500" fill="url(#peakRock)" />
  <!-- Snow Cap with Fluted Glaciers -->
  <polygon points="500,160 560,260 430,260" fill="url(#peakSnow)" />
  <polygon points="500,160 520,260 560,260" fill="#A8C4EB" />
  <polyline points="500,160 480,240 510,320 490,410 500,500" stroke="#061A3B" stroke-width="3" />

  <!-- Right Peak -->
  <polygon points="620,500 780,240 900,500" fill="url(#peakRock)" />
  <polygon points="780,240 830,330 730,330" fill="url(#peakSnow)" />

  <!-- Cultural Stupa / Pagoda Silhouette on Ridge -->
  <g transform="translate(180, 360)">
    <!-- Base -->
    <rect x="-35" y="40" width="70" height="25" fill="#09265B" rx="3" />
    <rect x="-25" y="25" width="50" height="15" fill="#123D85" />
    <!-- White Dome -->
    <path d="M -22,25 A 22,22 0 0,1 22,25 Z" fill="#F8FAFC" />
    <!-- Harmika Square -->
    <rect x="-9" y="-3" width="18" height="6" fill="url(#goldAccent)" />
    <!-- Eyes of the Buddha (Harmika eyes) -->
    <circle cx="-4" cy="0" r="1.5" fill="#09265B" />
    <circle cx="4" cy="0" r="1.5" fill="#09265B" />
    <!-- Spire (13 steps to enlightenment) -->
    <polygon points="-7,-3 7,-3 0,-24" fill="url(#goldAccent)" />
    <circle cx="0" cy="-26" r="3" fill="#D9A52E" />
  </g>

  <!-- Colorful Nepalese Prayer Flags Fluttering across Ridge -->
  <path d="M 120 330 Q 320 370 540 320 Q 720 370 880 310" fill="none" stroke="#D9A52E" stroke-width="1.8" />
  <!-- Small colored prayer flag pennants -->
  <!-- Blue (Sky), White (Air), Red (Fire), Green (Water), Yellow (Earth) -->
  <polygon points="150,336 170,340 166,358 148,354" fill="#0066CC" />
  <polygon points="180,342 200,346 196,364 178,360" fill="#FFFFFF" />
  <polygon points="210,348 230,352 226,370 208,366" fill="#E60000" />
  <polygon points="240,354 260,356 256,374 238,372" fill="#009933" />
  <polygon points="270,358 290,360 286,378 268,376" fill="#FFCC00" />
  
  <polygon points="370,354 390,352 388,370 368,372" fill="#0066CC" />
  <polygon points="400,350 420,348 418,366 398,368" fill="#FFFFFF" />
  <polygon points="430,346 450,344 448,362 428,364" fill="#E60000" />
  <polygon points="460,342 480,340 478,358 458,360" fill="#009933" />
  <polygon points="490,336 510,334 508,352 488,354" fill="#FFCC00" />

  <!-- Badge in corner: Land of Mt. Everest & Dedicated Workers -->
  <g transform="translate(40, 40)">
    <rect width="260" height="58" rx="29" fill="#09265B" fill-opacity="0.9" stroke="url(#goldAccent)" stroke-width="1.5" />
    <circle cx="30" cy="29" r="18" fill="url(#goldAccent)" />
    <!-- Mini Nepal flag icon -->
    <path d="M 22 37 L 34 30 L 27 30 L 36 21 L 22 21 Z" fill="#DC143C" />
    <text x="60" y="27" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14">Nepal: Heritage &amp; Talent</text>
    <text x="60" y="44" fill="#FCE182" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11">Renowned Work Ethic &amp; Loyalty</text>
  </g>
</svg>
